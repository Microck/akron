# Weekly grouped PRs for SHA-pinned GitHub Actions. NuGet is excluded because
# MonoMod must match what Everest ships and ImGui.NET pairs with native
# binaries, so those bumps need a manual in-game check.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
