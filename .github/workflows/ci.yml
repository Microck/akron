name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telemetry-tests:
    name: Telemetry consent and privacy tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.418
      - name: Restore locked telemetry tests
        run: dotnet restore tests/telemetry/akron-telemetry-tests.csproj --locked-mode --nologo
      - name: Verify consent, sanitized SDK envelopes, deduplication and shutdown
        run: dotnet test tests/telemetry/akron-telemetry-tests.csproj --configuration Release --no-restore --nologo

  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    environment: release-build
    env:
      HAS_CELESTE_REFS: ${{ secrets.AKRON_CELESTE_REFS_URL != '' && vars.AKRON_CELESTE_REFS_SHA256 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check Celeste reference configuration
        run: |
          if [ "$HAS_CELESTE_REFS" != "true" ]; then
            echo "::error::AKRON_CELESTE_REFS_URL and AKRON_CELESTE_REFS_SHA256 are required to build Akron."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.418

      - name: Restore verified Celeste references
        env:
          AKRON_CELESTE_REFS_URL: ${{ secrets.AKRON_CELESTE_REFS_URL }}
          AKRON_CELESTE_REFS_TOKEN: ${{ secrets.AKRON_CELESTE_REFS_TOKEN }}
          AKRON_CELESTE_REFS_SHA256: ${{ vars.AKRON_CELESTE_REFS_SHA256 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/restore-celeste-references.sh

      - name: Restore locked dependencies
        run: dotnet restore Akron.sln --locked-mode --nologo -p:ContinuousIntegrationBuild=true

      - name: Build
        run: dotnet build Akron.sln --configuration Release --no-restore --nologo -p:ContinuousIntegrationBuild=true

      - name: Capture targeted mod formatting evidence for this draft
        run: |
          mkdir -p validation
          changed_files=(Source/Core/akron-telemetry.cs Source/Module/akron-module-telemetry.cs Source/Module/AkronModuleSettings.cs Source/Module/AkronModule.cs Source/Actions/akron-startpos-persistence.cs Source/Overlay/akron-imgui-renderer.cs Source/SaveLoad/AkronSaveLoad.cs Source/Module/akron-module-menu.cs Source/Overlay/akron-overlay-entries.cs Source/Overlay/akron-overlay-copy.cs tests/module-settings-tests.cs)
          format_status=0
          dotnet format Akron.sln --no-restore --include "${changed_files[@]}" > validation/mod-format.log 2>&1 || format_status=$?
          git diff -- "${changed_files[@]}" > validation/mod-format.patch
          git restore -- "${changed_files[@]}"
          cat validation/mod-format.log
          exit "$format_status"

      - name: Upload mod formatting evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mod-formatting
          path: validation/mod-format.*
          retention-days: 3

      - name: Test
        run: dotnet test tests/akron-tests.csproj --configuration Release --no-build --nologo

      - name: Verify packaged mod
        run: |
          test -f Akron.zip
          if unzip -Z1 Akron.zip | grep -E '\.pdb$'; then
            echo "::error::Player package must not contain PDB files."
            exit 1
          fi
          unzip -Z1 Akron.zip | grep -Fx LICENSE >/dev/null
          unzip -Z1 Akron.zip | grep -Fx ThirdPartyNotices.txt >/dev/null
          unzip -Z1 Akron.zip | grep -Fx bin/Sentry.dll >/dev/null
          if unzip -Z1 Akron.zip | grep -E '(^|/)(sentry-cli[^/]*|sentry\.dll|libsentry[^/]*)(/|$)'; then
            echo "::error::Player package must not contain Sentry CLI or native crash handlers."
            exit 1
          fi
          cmp LICENSE <(unzip -p Akron.zip LICENSE)
          cmp licenses/third-party-notices.txt <(unzip -p Akron.zip ThirdPartyNotices.txt)

      - name: Upload packaged mod
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Akron
          path: Akron.zip
          if-no-files-found: error
          retention-days: 3
