apiVersion: v1
kind: Pod
metadata:
  name: akron-autoresearch
  namespace: sandboxes
  labels:
    app: akron-autoresearch
spec:
  restartPolicy: Always
  containers:
    - name: grader
      image: mcr.microsoft.com/dotnet/sdk:8.0.424
      imagePullPolicy: IfNotPresent
      command: ["/bin/sleep", "infinity"]
      env:
        - name: DOTNET_CLI_HOME
          value: /data/autoresearch/dotnet-home
        - name: NUGET_PACKAGES
          value: /data/autoresearch/nuget
        - name: DOTNET_CLI_TELEMETRY_OPTOUT
          value: "1"
        - name: DOTNET_NOLOGO
          value: "1"
      resources:
        # Equal requests and limits give this pod Guaranteed QoS. An integer CPU
        # request also permits exclusive CPUs on nodes using the static CPU manager.
        requests:
          cpu: "4"
          memory: 12Gi
        limits:
          cpu: "4"
          memory: 12Gi
      volumeMounts:
        - name: corpus-data
          mountPath: /data
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - test -s /data/corpus/manifest.sha256 && test -s /data/corpus-modded/manifest.sha256 && mkdir -p /data/autoresearch
        initialDelaySeconds: 2
        periodSeconds: 5
        failureThreshold: 12
  volumes:
    - name: corpus-data
      persistentVolumeClaim:
        claimName: akron-corpus-data
