# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Keep the organization-level review profile and guidance that already produced
# useful findings on Akron pull requests.
inheritance: true

knowledge_base:
  code_guidelines:
    filePatterns:
      - files: "docs/contributing/implementation-boundaries.mdx"
        applyTo: "Source/**/*.cs,tests/**/*.cs"
      - files: "docs/release-runbook.md,docs/reference/release-configuration.mdx"
        applyTo: ".github/workflows/release.yml,.github/workflows/sync-gamebanana-readme-links.yml,.github/scripts/**,scripts/publish-gamebanana-release.mjs,Makefile,Source/Akron.csproj"
reviews:
  path_filters:
    - "!**/*.dll"
    - "!**/*.gif"
    - "!**/*.ico"
    - "!**/*.jpeg"
    - "!**/*.jpg"
    - "!**/*.mp3"
    - "!**/*.ogg"
    - "!**/*.png"
    - "!**/*.pdb"
    - "!**/*.wav"
    - "!**/*.webp"
    - "!**/*.zip"
    - "!node_modules/**"
    - "!.dora/**"
    - "!.jj/**"
    - "!.residue/**"
    - "!.tmp/**"
    - "!Source/obj/**"
    - "!Source/Resources/**/*.dds"
    - "!Source/Resources/**/*.png"
    - "!Source/Resources/**/*.tex"
    - "!tmp/**"
    - "!checklist/**"
  path_instructions:
    - path: "**/*.md*"
      instructions: |
        Treat changed documentation as a public contract. Compare claims about
        UI labels, control types, defaults, policy classifications, command
        syntax, archive and persistence limits, setup scopes, and release
        configuration against the changed source, tests, and workflows. Flag
        only concrete mismatches and cite the conflicting repository evidence.

        Keep a row's policy classification distinct from the recorded attempt
        status. Keep persistent StartPos Set/Load separate from numbered
        savestate Capture/Restore actions. Keep .akr setup packs separate from
        the Backups tab's Celeste save-folder ZIPs.

        Check new local links, anchors, and navigation entries. Flag credentials,
        personal paths, or private machine details. Do not report Mintlify
        syntax, link, or accessibility checks that CI already covers unless the
        changed text creates a factual problem those checks cannot detect.
  pre_merge_checks:
    custom_checks:
      - name: Documentation impact
        mode: warning
        instructions: |
          PASS when the pull request either leaves public behavior unchanged or
          updates the matching documentation for changes to visible UI behavior,
          public commands, setup defaults, persistence or archive contracts, and
          release configuration.

          FAIL when one of those public contracts changes but the relevant user,
          reference, contributor, or release documentation is missing or still
          describes the old behavior. Cite both the changed contract and the
          specific documentation that is missing or stale.

          PASS without requiring documentation for tests, internal refactors,
          formatting, dependency-only changes, or build-only changes that do not
          alter a public contract. Return INCONCLUSIVE when the diff does not
          provide enough evidence to decide.
